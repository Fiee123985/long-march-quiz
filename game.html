<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a16">
  <meta name="robots" content="noindex">
  <title>关卡对战 · 长征问答</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/campaign.css">
  <link rel="stylesheet" href="css/salute.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="game">
  <canvas id="confetti" aria-hidden="true"></canvas>
  <button class="sound-toggle" id="sound-toggle" type="button" aria-label="关闭音效">🔊</button>

  <!-- ═══════════ 对战 ═══════════ -->
  <section class="screen screen--battle is-active" id="battle-view">
    <div class="battle-bg" aria-hidden="true"><img id="battle-bg-img" src="assets/battle-sunrise.svg" alt=""></div>
    <div class="battle-veil" aria-hidden="true"></div>

    <div class="battle-inner">
      <div class="battle-topbar">
        <a class="icon-btn" href="index.html"><span>←</span> 撤离</a>
        <div class="battle-brand" id="level-label">第 1 关 · 5,000 里</div>
        <div class="round-dots" id="round-dots" aria-label="题目进度"></div>
      </div>

      <header class="hud">
        <div class="player-card p1" id="hud-p1">
          <div class="avatar avatar--hero" aria-hidden="true"></div>
          <div class="player-info">
            <div class="player-name-row">
              <span class="player-name" id="name-p1">红军 · 星火</span>
            </div>
            <div class="hp-row">
              <div class="hp-track"><div class="hp-fill" id="hp-fill-p1"></div></div>
              <span class="hp-num" id="hp-num-p1">50</span>
            </div>
            <div class="player-status" id="status-p1">准备作答</div>
          </div>
        </div>

        <div class="hud-center">
          <div class="round-tag" id="round-tag">第 1 / 5 题</div>
          <div class="timer" id="timer">
            <svg viewBox="0 0 80 80" aria-hidden="true">
              <circle class="timer-track" cx="40" cy="40" r="34"></circle>
              <circle class="timer-bar" id="timer-bar" cx="40" cy="40" r="34"></circle>
            </svg>
            <span class="timer-num" id="timer-num">12</span>
          </div>
        </div>

        <div class="player-card p2" id="hud-p2">
          <div class="avatar avatar--enemy" aria-hidden="true"></div>
          <div class="player-info">
            <div class="player-name-row">
              <span class="player-name" id="name-p2">湘江追兵</span>
            </div>
            <div class="hp-row">
              <div class="hp-track"><div class="hp-fill" id="hp-fill-p2"></div></div>
              <span class="hp-num" id="hp-num-p2">50</span>
            </div>
            <div class="player-status" id="status-p2">据险阻击</div>
          </div>
        </div>
      </header>

      <main class="arena">
        <div class="question-card" id="question-card">
          <div class="qmeta">
            <div class="qmeta-left">
              <span class="chip" id="q-chip">选择题</span>
              <span class="q-stage" id="q-stage">出发</span>
            </div>
            <span class="q-index" id="q-index">第 1 / 5 题</span>
          </div>
          <h2 class="question-text" id="q-text">题目加载中…</h2>
        </div>

        <div class="options" id="option-list"></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
      </main>

      <div class="scene-label" id="scene-label">长征路 · 血战湘江</div>
    </div>

    <div class="fx-layer" id="fx-layer" aria-hidden="true"></div>
  </section>

  <!-- ═══════════ 结算 ═══════════ -->
  <section class="screen screen--result" id="result-view">
    <div class="result-bg" aria-hidden="true"><img id="result-bg-img" src="assets/battle-sunrise.svg" alt=""></div>
    <div class="result-veil" aria-hidden="true"></div>

    <div class="result-card" id="result-card">
      <div class="result-emoji" id="result-emoji">🏆</div>
      <div class="result-kicker" id="result-kicker">关卡结算</div>
      <h2 class="result-title" id="result-title">关卡通过</h2>
      <p class="result-sub" id="result-sub">我方兵力高于敌方，成功突围</p>

      <div class="best-banner is-hidden" id="best-banner">🎉 刷新本关最佳纪录</div>

      <div class="final-score">
        <div class="final-side p1">
          <span id="final-name-1">红军 · 星火</span>
          <strong id="final-hp-1">30</strong>
          <small>我方剩余兵力</small>
        </div>
        <div class="final-vs">VS</div>
        <div class="final-side p2">
          <span id="final-name-2">湘江追兵</span>
          <strong id="final-hp-2">20</strong>
          <small>敌方剩余兵力</small>
        </div>
      </div>

      <div class="stat-table stat-table--single" id="stat-table"></div>

      <div class="result-actions">
        <button class="btn-primary" id="btn-next" type="button">前往下一关</button>
        <button class="btn-ghost" id="btn-menu" type="button">返回关卡地图</button>
      </div>
      <p class="result-saved" id="result-saved">本关最佳成绩已保存</p>
      <button class="salute-replay is-hidden" id="btn-salute-replay" type="button">🎖 再看一次敬礼</button>
    </div>
  </section>

  <!-- ═══════════ 红军敬礼动画 ═══════════ -->
  <div class="salute-overlay is-hidden" id="salute-overlay" role="dialog" aria-modal="true" aria-labelledby="salute-title" aria-hidden="true">
    <div class="salute-glow" aria-hidden="true"></div>
    <div class="salute-panel">
      <div class="salute-kicker" id="salute-kicker">LEVEL CLEARED · 长征问答</div>
      <img class="salute-figure" id="salute-figure" src="assets/salute.svg" alt="红军战士向长征致敬">
      <h2 class="salute-title" id="salute-title">关卡通过</h2>
      <p class="salute-sub" id="salute-sub">向长征路上的英雄致敬</p>
      <button class="btn-primary btn-small" id="salute-close" type="button">继续前进</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/questions.js"></script>
  <script src="js/site.js"></script>
  <script src="js/game.js"></script>
</body>
</html>

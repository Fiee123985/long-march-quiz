    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbe4ef"/>
      <stop offset=".5" stop-color="#8b97a8"/>
      <stop offset="1" stop-color="#4a5565"/>

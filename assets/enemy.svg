<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="skinE" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#f6ddcb"/>
      <stop offset=".55" stop-color="#e8c0ad"/>
      <stop offset="1" stop-color="#c99483"/>
    </linearGradient>
    <linearGradient id="neckE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3a894"/>
      <stop offset="1" stop-color="#a97665"/>

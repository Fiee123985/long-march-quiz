    <linearGradient id="coat" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2c3541"/>
      <stop offset=".5" stop-color="#1b222c"/>
      <stop offset="1" stop-color="#0c1016"/>
    </linearGradient>
    <linearGradient id="coatDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c232d"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="capE" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#3b4757"/>
      <stop offset=".55" stop-color="#242d39"/>
      <stop offset="1" stop-color="#131922"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3442"/>

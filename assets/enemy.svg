    <radialGradient id="irisE" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#ffd479"/>
      <stop offset=".5" stop-color="#c58f2f"/>
      <stop offset="1" stop-color="#5c3c0e"/>
    </radialGradient>
    <filter id="softE" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#04060d" flood-opacity=".4"/>
    </filter>
    <filter id="glowE" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="eyeL2">
      <path d="M158 238 Q176 226 195 236 Q181 248 164 246 Q159 243 158 238 Z"/>
    </clipPath>
    <clipPath id="eyeR2">
      <path d="M242 238 Q224 226 205 236 Q219 248 236 246 Q241 243 242 238 Z"/>
    </clipPath>
  </defs>


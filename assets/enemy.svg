    <path d="M58 496 C66 424 104 382 156 358" fill="none" stroke="#ff7fa8" stroke-width="3" opacity=".3"/>
    <path d="M342 496 C334 424 296 382 244 358" fill="none" stroke="#9fd6ff" stroke-width="3" opacity=".28"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset=".55" stop-color="#18213b"/>
      <stop offset="1" stop-color="#3b2d3d"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe8c8" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffe8c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d4a38"/>
      <stop offset="1" stop-color="#3a2622"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2026"/>
      <stop offset="1" stop-color="#120e14"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3a1"/>
      <stop offset="1" stop-color="#f0a34f"/>
    </linearGradient>
    <radialGradient id="windowGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".46" r=".72">
      <stop offset=".5" stop-color="#03050b" stop-opacity="0"/>
      <stop offset="1" stop-color="#03050b" stop-opacity=".55"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="800" height="450"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="800" height="450" fill="url(#sky)"/>
    <circle cx="648" cy="92" r="120" fill="url(#moonGlow)"/>
    <circle cx="648" cy="92" r="34" fill="#f6e4c9" opacity=".9"/>
    <g fill="#e7eeff">
      <circle cx="90" cy="60" r="1.6" opacity=".6"/>
      <circle cx="210" cy="100" r="1.2" opacity=".45"/>
      <circle cx="330" cy="50" r="1.4" opacity=".5"/>
      <circle cx="500" cy="120" r="1.2" opacity=".4"/>
      <circle cx="728" cy="160" r="1.5" opacity=".5"/>
    </g>

    <path d="M0 260 C120 220 240 238 360 232 C480 226 600 246 800 214 L800 320 L0 320 Z" fill="#111727" opacity=".9"/>
    <path d="M0 290 C150 268 300 286 450 278 C600 270 700 284 800 276 L800 340 L0 340 Z" fill="#0b111c"/>

    <!-- 远处民居 -->
    <g opacity=".8">
      <path d="M40 330 L40 280 L88 258 L136 280 L136 330 Z" fill="#241b1f"/>
      <path d="M30 282 L88 250 L146 282 L136 290 L88 266 L40 290 Z" fill="url(#roof)"/>
      <path d="M188 330 L188 286 L230 268 L272 286 L272 330 Z" fill="#241b1f"/>
      <path d="M178 288 L230 260 L282 288 L272 296 L230 274 L188 296 Z" fill="url(#roof)"/>
      <path d="M620 332 L620 282 L672 258 L724 282 L724 332 Z" fill="#241b1f"/>
      <path d="M608 284 L672 250 L736 284 L724 292 L672 266 L620 292 Z" fill="url(#roof)"/>
    </g>

    <!-- 中央会址 -->
    <g>
      <path d="M258 358 L258 238 L400 190 L542 238 L542 358 Z" fill="url(#wall)"/>
      <path d="M238 240 L400 178 L562 240 L542 252 L400 198 L258 252 Z" fill="url(#roof)"/>
      <path d="M270 236 L400 188 L530 236 L530 250 L400 204 L270 250 Z" fill="#5a3a2c" opacity=".45"/>
      <path d="M330 358 L330 300 L400 268 L470 300 L470 358 Z" fill="#2a1b1a"/>
      <path d="M338 358 L338 306 L400 278 L462 306 L462 358 Z" fill="url(#window)"/>
      <path d="M400 278 L400 358 M338 330 L462 330" stroke="#4a2b20" stroke-width="5" opacity=".8"/>
      <circle cx="400" cy="262" r="46" fill="url(#windowGlow)"/>
      <!-- 窗 -->
      <g fill="url(#window)">
        <rect x="284" y="282" width="28" height="34" rx="3"/>
        <rect x="488" y="282" width="28" height="34" rx="3"/>
        <rect x="284" y="332" width="28" height="26" rx="3" opacity=".75"/>
        <rect x="488" y="332" width="28" height="26" rx="3" opacity=".75"/>
      </g>
      <g stroke="#4a2b20" stroke-width="2" opacity=".8">
        <path d="M298 282 V316 M284 299 H312"/>
        <path d="M502 282 V316 M488 299 H516"/>
      </g>
      <!-- 红星 -->
      <g filter="url(#glow)">
        <polygon points="400,208 404.4,218.6 416,219.4 407.1,227.1 409.9,238.4 400,231.3 390.1,238.4 392.9,227.1 384,219.4 395.6,218.6" fill="#e63946" stroke="#ff9a9a" stroke-width="1"/>
      </g>
      <!-- 灯笼 -->
      <g fill="#e63946" filter="url(#glow)">
        <ellipse cx="278" cy="270" rx="7" ry="10"/>
        <ellipse cx="522" cy="270" rx="7" ry="10"/>
      </g>
    </g>

    <!-- 红旗 -->
    <g>
      <path d="M168 346 L172 258" stroke="#5a3c28" stroke-width="4"/>
      <path d="M171 262 C190 254 206 264 224 258 C218 272 226 282 220 294 C202 300 186 290 171 296 Z" fill="#d42f3f" filter="url(#glow)"/>
    </g>

    <!-- 地面石板 -->
    <path d="M0 358 L800 358 L800 450 L0 450 Z" fill="#171318"/>
    <g stroke="#2c252a" stroke-width="2" opacity=".7">
      <path d="M40 386 H160 M190 386 H310 M340 386 H460 M490 386 H610 M640 386 H760"/>
      <path d="M20 414 H140 M170 414 H290 M320 414 H440 M470 414 H590 M620 414 H740"/>
    </g>
    <path d="M0 358 C180 350 360 362 540 356 C660 352 740 358 800 354 L800 370 L0 374 Z" fill="#2b2024" opacity=".6"/>

    <g filter="url(#soft)" opacity=".35">
      <ellipse cx="400" cy="350" rx="250" ry="24" fill="#ffcf7a"/>
      <ellipse cx="200" cy="380" rx="160" ry="20" fill="#8fa4c4"/>
    </g>

    <rect width="800" height="450" fill="url(#vig)"/>
  </g>
</svg>

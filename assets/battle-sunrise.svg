<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4d2232"/>
      <stop offset="0.34" stop-color="#8d3d46"/>
      <stop offset="0.62" stop-color="#d46858"/>
      <stop offset="0.82" stop-color="#f2a079"/>
      <stop offset="1" stop-color="#f8c7a7"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.46" r="0.5">
      <stop stop-color="#ffe6a8"/>
      <stop offset="0.16" stop-color="#ffc36f"/>
      <stop offset="0.42" stop-color="#f47b57"/>
      <stop offset="0.68" stop-color="#d84b43"/>
      <stop offset="0.86" stop-color="#a93439"/>
      <stop offset="1" stop-color="#a93439" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#ffb477" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#e1735d" stop-opacity="0.2"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040711"/>
      <stop offset=".35" stop-color="#101a33"/>
      <stop offset=".62" stop-color="#2a3158"/>
      <stop offset=".82" stop-color="#5b4a6b"/>
      <stop offset="1" stop-color="#8b6270"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9cf" stop-opacity=".85"/>
      <stop offset=".28" stop-color="#ffd9b0" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffd9b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cliffL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset=".55" stop-color="#141c2d"/>
      <stop offset="1" stop-color="#2b3348"/>
    </linearGradient>
    <linearGradient id="cliffR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset=".55" stop-color="#151d2e"/>
      <stop offset="1" stop-color="#30374c"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#163d4a"/>
      <stop offset=".45" stop-color="#0c2833"/>
      <stop offset="1" stop-color="#061118"/>
    </linearGradient>
    <linearGradient id="deckGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f2116"/>
      <stop offset=".5" stop-color="#6b4c31"/>
      <stop offset="1" stop-color="#332317"/>
    </linearGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset="1" stop-color="#9e1b2a"/>
    </linearGradient>
    <pattern id="ropes" width="34" height="320" patternUnits="userSpaceOnUse">
      <line x1="17" y1="0" x2="17" y2="320" stroke="#8d99ab" stroke-width="1.5" opacity=".8"/>
    </pattern>
    <pattern id="planks" width="13" height="40" patternUnits="userSpaceOnUse">
      <line x1="6" y1="0" x2="6" y2="40" stroke="#2a1c12" stroke-width="2" opacity=".85"/>
    </pattern>
    <pattern id="rain" width="160" height="160" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <line x1="10" y1="0" x2="10" y2="26" stroke="#cfe4ff" stroke-width="1.2" opacity=".13"/>
      <line x1="74" y1="40" x2="74" y2="66" stroke="#cfe4ff" stroke-width="1" opacity=".1"/>
      <line x1="130" y1="90" x2="130" y2="116" stroke="#cfe4ff" stroke-width="1.2" opacity=".12"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="suspenders">
      <path d="M340 420 Q800 545 1260 420 L1260 495 Q800 620 340 495 Z"/>
    </clipPath>
    <clipPath id="deckClip">
      <path d="M340 486 Q800 611 1260 486 L1260 506 Q800 631 340 506 Z"/>
    </clipPath>
    <clipPath id="sceneClip">
      <rect width="1600" height="900"/>
    </clipPath>
    <radialGradient id="vig" cx=".5" cy=".46" r=".74">
      <stop offset=".5" stop-color="#02040a" stop-opacity="0"/>
      <stop offset="1" stop-color="#02040a" stop-opacity=".55"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#sceneClip)">
    <!-- 天空 -->
    <rect width="1600" height="900" fill="url(#sky)"/>

    <!-- 月与光晕 -->
    <circle cx="1235" cy="168" r="210" fill="url(#moonGlow)"/>
    <circle cx="1235" cy="168" r="66" fill="#ffe9d2" opacity=".92"/>
    <circle cx="1235" cy="168" r="58" fill="#fff4e4"/>
    <circle cx="1214" cy="150" r="11" fill="#f2ddc6" opacity=".55"/>
    <circle cx="1252" cy="186" r="7" fill="#f2ddc6" opacity=".4"/>
    <circle cx="1258" cy="146" r="5" fill="#f2ddc6" opacity=".35"/>

    <!-- 星 -->
    <g fill="#dbe7ff">
      <circle cx="120" cy="90" r="2.2" opacity=".7"/>
      <circle cx="260" cy="150" r="1.5" opacity=".5"/>
      <circle cx="410" cy="70" r="2" opacity=".65"/>
      <circle cx="560" cy="190" r="1.4" opacity=".45"/>
      <circle cx="700" cy="110" r="2.4" opacity=".7"/>
      <circle cx="860" cy="200" r="1.6" opacity=".5"/>
      <circle cx="980" cy="90" r="2" opacity=".6"/>
      <circle cx="1450" cy="120" r="2.2" opacity=".6"/>
      <circle cx="1520" cy="240" r="1.5" opacity=".4"/>
      <circle cx="1080" cy="260" r="1.4" opacity=".4"/>
    </g>

    <!-- 月光光束 -->
    <g opacity=".08" fill="#e9f3ff">
      <polygon points="1235,168 560,900 860,900"/>
      <polygon points="1235,168 980,900 1320,900"/>
      <polygon points="1235,168 1400,900 1600,760"/>
    </g>

    <!-- 云层 -->
    <g filter="url(#soft)" opacity=".85">
      <path d="M-80 260 C160 200 300 258 470 224 C620 194 700 246 860 228 C1000 212 1100 258 1240 236 C1380 214 1500 252 1680 220 L1680 360 L-80 360 Z" fill="#131c33"/>
      <path d="M-80 380 C120 340 260 376 430 350 C600 324 720 370 900 348 C1060 328 1180 368 1340 346 C1480 326 1580 360 1680 340 L1680 470 L-80 470 Z" fill="#1b2440" opacity=".75"/>
    </g>
    <g fill="#6b5a7f" opacity=".28" filter="url(#soft2)">
      <path d="M-40 320 C170 280 330 318 500 292 C670 266 790 310 960 288 C1120 268 1260 306 1420 284 L1420 304 C1260 326 1120 288 960 308 C790 330 670 286 500 312 C330 338 170 300 -40 340 Z"/>
      <path d="M120 430 C290 404 430 432 580 414 C740 394 860 428 1020 410 C1170 394 1300 424 1460 404 L1460 418 C1300 438 1170 408 1020 424 C860 442 740 408 580 428 C430 446 290 418 120 444 Z"/>
    </g>

    <!-- 远处峡谷 -->
    <path d="M0 520 C180 470 300 482 420 512 C560 548 650 520 760 540 C880 562 980 520 1100 536 C1230 554 1330 500 1460 520 C1530 530 1570 540 1600 550 L1600 900 L0 900 Z" fill="#0c1322" opacity=".9"/>
    <path d="M390 520 C520 488 640 500 760 526 C880 552 1000 512 1120 530 C1210 544 1290 522 1370 530 L1370 700 L390 700 Z" fill="#121a2b" opacity=".8"/>

    <!-- 左侧峭壁 -->
    <path d="M0 240 C100 250 190 300 270 340 C360 386 430 398 510 430 L560 900 L0 900 Z" fill="url(#cliffL)"/>
    <path d="M0 300 C110 312 190 348 262 390 L330 436 L370 900 L0 900 Z" fill="#101827"/>
    <path d="M0 470 C120 452 210 470 280 510 L300 640 L180 690 L0 660 Z" fill="#1a2336" opacity=".8"/>
    <path d="M0 640 C110 620 210 650 270 690 L250 900 L0 900 Z" fill="#0a101c"/>
    <path d="M60 330 C140 354 200 388 250 424" fill="none" stroke="#46536b" stroke-width="3" opacity=".35"/>
    <path d="M110 420 C160 440 200 470 228 500" fill="none" stroke="#46536b" stroke-width="2" opacity=".25"/>
    <path d="M210 380 L226 900" stroke="#050910" stroke-width="5" opacity=".4"/>
    <path d="M300 430 L330 900" stroke="#050910" stroke-width="4" opacity=".35"/>

    <!-- 右侧峭壁 -->
    <path d="M1600 230 C1500 244 1410 296 1330 338 C1240 386 1170 398 1090 430 L1040 900 L1600 900 Z" fill="url(#cliffR)"/>
    <path d="M1600 292 C1490 306 1410 344 1338 388 L1270 436 L1230 900 L1600 900 Z" fill="#111a2a"/>
    <path d="M1600 468 C1480 450 1390 470 1320 512 L1300 650 L1420 700 L1600 668 Z" fill="#1b2437" opacity=".8"/>
    <path d="M1600 640 C1490 620 1390 650 1330 690 L1350 900 L1600 900 Z" fill="#0a101c"/>
    <path d="M1540 326 C1460 352 1400 388 1350 424" fill="none" stroke="#4a586f" stroke-width="3" opacity=".35"/>
    <path d="M1490 418 C1440 440 1400 472 1372 502" fill="none" stroke="#4a586f" stroke-width="2" opacity=".25"/>
    <path d="M1390 378 L1374 900" stroke="#050910" stroke-width="5" opacity=".4"/>
    <path d="M1300 430 L1270 900" stroke="#050910" stroke-width="4" opacity=".35"/>

    <!-- 峡谷深处雾气 -->
    <g filter="url(#soft)" opacity=".55">
      <ellipse cx="800" cy="470" rx="380" ry="50" fill="#8fa4c4"/>
      <ellipse cx="780" cy="520" rx="300" ry="34" fill="#b7c9e2" opacity=".5"/>
    </g>

    <!-- 泸定桥：铁索与桥面 -->
    <g>
      <!-- 固定铁柱 -->
      <g fill="#3b4658" stroke="#0a0f18" stroke-width="3">
        <rect x="320" y="360" width="22" height="170" rx="4"/>
        <rect x="1258" y="360" width="22" height="170" rx="4"/>
        <rect x="300" y="340" width="62" height="18" rx="5"/>
        <rect x="1238" y="340" width="62" height="18" rx="5"/>
      </g>
      <path d="M330 372 L330 520 M1270 372 L1270 520" stroke="#7c8799" stroke-width="2" opacity=".5"/>

      <!-- 悬挂索 -->
      <rect x="320" y="360" width="960" height="330" fill="url(#ropes)" clip-path="url(#suspenders)"/>
      <path d="M340 420 Q800 545 1260 420" fill="none" stroke="#a8b4c6" stroke-width="5"/>
      <path d="M340 410 Q800 535 1260 410" fill="none" stroke="#6e7b8e" stroke-width="2" opacity=".7"/>

      <!-- 桥面 -->
      <path d="M340 495 Q800 620 1260 495" fill="none" stroke="url(#deckGrad)" stroke-width="20"/>
      <rect x="320" y="480" width="960" height="40" fill="url(#planks)" clip-path="url(#deckClip)"/>
      <path d="M340 487 Q800 612 1260 487" fill="none" stroke="#9a7650" stroke-width="1.6" opacity=".55"/>

      <!-- 桥头立柱 -->
      <g fill="#241a12" stroke="#6b5439" stroke-width="2">
        <path d="M330 390 L346 390 L350 520 L326 520 Z"/>
        <path d="M1254 390 L1270 390 L1274 520 L1250 520 Z"/>
        <path d="M318 380 L358 380 L354 396 L322 396 Z"/>
        <path d="M1242 380 L1282 380 L1278 396 L1246 396 Z"/>
      </g>

      <!-- 桥上的队伍 -->
      <g fill="#080b12" opacity=".92">
        <g transform="translate(660 548) scale(.62)">
          <circle cx="0" cy="-42" r="8"/>
          <path d="M-8 -32 Q0 -38 8 -32 L11 2 L5 2 L2 -16 L0 2 L-5 2 L-8 -16 L-12 2 L-18 2 Z"/>
          <path d="M-7 -28 L-18 -6 M7 -28 L18 -8" stroke="#080b12" stroke-width="5" stroke-linecap="round"/>
          <path d="M-4 2 L-8 30 M4 2 L9 30" stroke="#080b12" stroke-width="5" stroke-linecap="round"/>
        </g>
        <g transform="translate(706 559) scale(.6)">
          <circle cx="0" cy="-42" r="8"/>
          <path d="M-8 -32 Q0 -38 8 -32 L11 2 L5 2 L2 -16 L0 2 L-5 2 L-8 -16 L-12 2 L-18 2 Z"/>
          <path d="M-7 -28 L-18 -6 M7 -28 L18 -8" stroke="#080b12" stroke-width="5" stroke-linecap="round"/>
          <path d="M-4 2 L-8 30 M4 2 L9 30" stroke="#080b12" stroke-width="5" stroke-linecap="round"/>
        </g>
        <g transform="translate(756 568) scale(.62)">
          <circle cx="0" cy="-42" r="8"/>
          <path d="M-8 -32 Q0 -38 8 -32 L11 2 L5 2 L2 -16 L0 2 L-5 2 L-8 -16 L-12 2 L-18 2 Z"/>
          <path d="M-7 -28 L-18 -6 M7 -28 L18 -8" stroke="#080b12" stroke-width="5" stroke-linecap="round"/>
          <path d="M-4 2 L-8 30 M4 2 L9 30" stroke="#080b12" stroke-width="5" stroke-linecap="round"/>
        </g>
        <g transform="translate(808 575) scale(.6)">
          <circle cx="0" cy="-42" r="8"/>
          <path d="M-8 -32 Q0 -38 8 -32 L11 2 L5 2 L2 -16 L0 2 L-5 2 L-8 -16 L-12 2 L-18 2 Z"/>
          <path d="M-7 -28 L-18 -6 M7 -28 L18 -8" stroke="#080b12" stroke-width="5" stroke-linecap="round"/>
          <path d="M-4 2 L-8 30 M4 2 L9 30" stroke="#080b12" stroke-width="5" stroke-linecap="round"/>
        </g>
        <g transform="translate(862 572) scale(.62)">
          <circle cx="0" cy="-42" r="8"/>
          <path d="M-8 -32 Q0 -38 8 -32 L11 2 L5 2 L2 -16 L0 2 L-5 2 L-8 -16 L-12 2 L-18 2 Z"/>
          <path d="M-7 -28 L-18 -6 M7 -28 L18 -8" stroke="#080b12" stroke-width="5" stroke-linecap="round"/>
          <path d="M-4 2 L-8 30 M4 2 L9 30" stroke="#080b12" stroke-width="5" stroke-linecap="round"/>
        </g>
      </g>

      <!-- 红旗 -->
      <g>
        <path d="M348 320 L354 500" stroke="#6b5439" stroke-width="5"/>
        <path d="M352 326 C390 314 420 332 456 320 C444 344 460 360 448 382 C414 392 384 374 352 384 Z" fill="url(#flag)" filter="url(#glow)"/>
        <path d="M352 326 C390 314 420 332 456 320" fill="none" stroke="#ff9a9a" stroke-width="2" opacity=".5"/>
        <polygon points="378,338 381,346 389,346 383,351 385,359 378,354 371,359 373,351 367,346 375,346" fill="#ffd166" opacity=".9"/>
      </g>
    </g>

    <!-- 河流 -->
    <path d="M0 640 C160 620 260 650 380 690 C520 736 640 700 800 690 C980 678 1120 720 1260 700 C1380 684 1500 660 1600 672 L1600 900 L0 900 Z" fill="url(#river)"/>
    <path d="M0 700 C180 680 300 720 440 750 C600 786 720 748 880 736 C1040 724 1200 760 1600 720 L1600 900 L0 900 Z" fill="#08202a" opacity=".8"/>
    <!-- 白浪 -->
    <g fill="none" stroke="#a9d7e0" stroke-linecap="round">
      <path d="M120 760 C210 748 280 772 360 762" stroke-width="4" opacity=".4"/>
      <path d="M420 800 C520 784 600 812 700 798" stroke-width="3" opacity=".35"/>
      <path d="M760 770 C850 756 930 780 1020 766" stroke-width="4" opacity=".4"/>
      <path d="M1080 820 C1180 802 1280 828 1380 810" stroke-width="3" opacity=".3"/>
      <path d="M200 850 C300 834 380 858 480 844" stroke-width="3" opacity=".25"/>
      <path d="M900 860 C1010 842 1100 868 1210 850" stroke-width="3" opacity=".25"/>
    </g>
    <!-- 河中巨石 -->
    <g fill="#101923" stroke="#2f4152" stroke-width="2">
      <path d="M250 780 L310 760 L360 786 L340 820 L270 816 Z"/>
      <path d="M1150 760 L1210 742 L1260 770 L1230 806 L1160 800 Z"/>
    </g>
    <g filter="url(#soft)" opacity=".35">
      <ellipse cx="800" cy="740" rx="420" ry="28" fill="#cfe6f2"/>
      <ellipse cx="700" cy="690" rx="350" ry="24" fill="#cfe6f2"/>
    </g>

    <!-- 雨与雾 -->
    <rect width="1600" height="900" fill="url(#rain)"/>
    <g filter="url(#soft)" opacity=".18">
      <ellipse cx="420" cy="600" rx="300" ry="60" fill="#d7e4f5"/>
      <ellipse cx="1180" cy="590" rx="260" ry="46" fill="#d7e4f5"/>
    </g>

    <!-- 柔和暗角 -->
    <rect width="1600" height="900" fill="url(#vig)"/>
  </g>
</svg>

    <path d="M105 406 L145 392 L152 410 L112 424 Z" fill="#3b4838" stroke="#909d80" stroke-width="1.5"/>
    <path d="M295 406 L255 392 L248 410 L288 424 Z" fill="#3b4838" stroke="#909d80" stroke-width="1.5"/>
    <path d="M128 400 l5 11" stroke="#c92f3f" stroke-width="3"/>

    <path d="M126 190 C124 120 156 106 200 106 C244 106 276 120 274 190 C252 176 226 172 200 172 C174 172 148 176 126 190 Z" fill="url(#cap)"/>
    <path d="M128 184 C150 170 174 166 200 166 C226 166 250 170 272 184 L272 198 C248 184 226 180 200 180 C174 180 152 184 128 198 Z" fill="#34402f"/>
    <path d="M200 108 L200 178" stroke="#2c382a" stroke-width="2" opacity=".5"/>
    <path d="M158 116 L174 180" stroke="#2c382a" stroke-width="2" opacity=".35"/>
    <path d="M242 116 L226 180" stroke="#2c382a" stroke-width="2" opacity=".35"/>
    <path d="M126 190 C150 178 174 174 200 174" fill="none" stroke="#9aa98c" stroke-width="2" opacity=".5"/>
    <path d="M274 190 C250 178 226 174 200 174" fill="none" stroke="#9aa98c" stroke-width="2" opacity=".5"/>
    <!-- 红五星 -->
    <g filter="url(#starGlow)">
      <polygon points="200,134 204.7,145.5 217.1,146.4 207.6,154.5 210.6,167.7 200,160 189.4,167.7 192.4,154.5 182.9,146.4 195.3,145.5"
        fill="#e23145" stroke="#ff8a8a" stroke-width="1.2"/>
      <polygon points="200,141 202.4,147.4 209.2,147.9 204,152.3 205.6,159.5 200,155.4 194.4,159.5 196,152.3 190.8,147.9 197.6,147.4"
        fill="#ff6b6b" opacity=".55"/>
    </g>
    <!-- 眉毛 -->
    <path d="M156 212 Q174 202 194 210" fill="none" stroke="#2a1c1c" stroke-width="6" stroke-linecap="round"/>
    <path d="M244 212 Q226 202 206 210" fill="none" stroke="#2a1c1c" stroke-width="6" stroke-linecap="round"/>
    <!-- 眼睛 -->
    <path d="M157 235 Q176 218 195 232 Q181 251 163 249 Q158 244 157 235 Z" fill="#fffaf6"/>
    <g clip-path="url(#eyeClipL)">

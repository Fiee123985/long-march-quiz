    <path d="M118 382 C152 418 196 452 262 484" fill="none" stroke="#a97a52" stroke-width="2" opacity=".55"/>
    <rect x="196" y="444" width="30" height="22" rx="4" transform="rotate(31 211 455)" fill="#8d653f" stroke="#c9a06f" stroke-width="2"/>
    <rect x="203" y="450" width="16" height="10" rx="2" transform="rotate(31 211 455)" fill="#3c2a1c"/>

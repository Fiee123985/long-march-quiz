    <path d="M142 206 C142 144 168 118 200 118 L200 344 C172 338 148 306 145 258 Z" fill="#ffffff" opacity=".08"/>
    <path d="M240 214 C248 252 244 296 224 324 C238 300 242 256 234 214 Z" fill="#c98368" opacity=".22"/>
    <!-- 腮红 -->
    <ellipse cx="168" cy="274" rx="17" ry="9" fill="url(#cheek)"/>
    <ellipse cx="232" cy="274" rx="17" ry="9" fill="url(#cheek)"/>
    <!-- 刘海 -->
    <path d="M142 202 C144 168 165 150 188 154 C196 166 198 176 200 184 C205 170 213 158 224 154 C247 158 258 176 258 202 C245 190 232 190 224 200 C214 184 206 182 200 196 C192 182 182 182 174 198 C166 188 154 190 142 202 Z" fill="#2b2021"/>
    <path d="M148 194 C160 178 176 174 190 182" fill="none" stroke="#4a3832" stroke-width="3" opacity=".55"/>

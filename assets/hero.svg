      <ellipse cx="178" cy="237" rx="6" ry="9" fill="#1d1110"/>
      <circle cx="174" cy="228" r="4.2" fill="#ffffff"/>
      <circle cx="182" cy="242" r="2" fill="#ffd8b8" opacity=".85"/>
      <path d="M158 228 Q176 224 196 232" stroke="#3d2620" stroke-width="2" opacity=".35" fill="none"/>
    </g>
    <path d="M155 233 Q176 214 197 230" fill="none" stroke="#2a1a19" stroke-width="5" stroke-linecap="round"/>
    <path d="M162 247 Q178 252 192 242" fill="none" stroke="#d99a86" stroke-width="2" stroke-linecap="round" opacity=".75"/>
    <path d="M243 235 Q224 218 205 232 Q219 251 237 249 Q242 244 243 235 Z" fill="#fffaf6"/>
    <g clip-path="url(#eyeClipR)">
      <ellipse cx="222" cy="235" rx="11" ry="14" fill="url(#iris)"/>
      <ellipse cx="222" cy="237" rx="6" ry="9" fill="#1d1110"/>
      <circle cx="218" cy="228" r="4.2" fill="#ffffff"/>
      <circle cx="226" cy="242" r="2" fill="#ffd8b8" opacity=".85"/>
      <path d="M242 228 Q224 224 204 232" stroke="#3d2620" stroke-width="2" opacity=".35" fill="none"/>

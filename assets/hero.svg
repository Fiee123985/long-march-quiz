    <ellipse cx="260" cy="246" rx="12" ry="20" fill="#f2b795"/>
    <path d="M140 238 q7 5 1 14" fill="none" stroke="#ce8d73" stroke-width="2" opacity=".6"/>
    <path d="M260 238 q-7 5 -1 14" fill="none" stroke="#ce8d73" stroke-width="2" opacity=".6"/>
    <!-- 脸 -->
    <path d="M142 206 C142 144 168 118 200 118 C232 118 258 144 258 206 L255 258 C252 306 228 338 200 344 C172 338 148 306 145 258 Z" fill="url(#skin)"/>

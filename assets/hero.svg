<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#ffe4cd"/>
      <stop offset=".52" stop-color="#f7c6a6"/>
      <stop offset="1" stop-color="#df9b7d"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5ab8b"/>
      <stop offset="1" stop-color="#c98267"/>
    </linearGradient>
    <linearGradient id="uniform" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#75846c"/>
      <stop offset=".45" stop-color="#52604d"/>
      <stop offset="1" stop-color="#303b30"/>
    </linearGradient>
    <linearGradient id="uniformDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#44513f"/>
      <stop offset="1" stop-color="#263027"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#7d8c72"/>
      <stop offset=".55" stop-color="#55644f"/>
      <stop offset="1" stop-color="#394633"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e4a32"/>
      <stop offset="1" stop-color="#3d281b"/>
    </linearGradient>
    <radialGradient id="iris" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#8a5a3c"/>
      <stop offset=".55" stop-color="#5b3526"/>
      <stop offset="1" stop-color="#2b1714"/>
    </radialGradient>
    <radialGradient id="cheek" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f2877a" stop-opacity=".34"/>
      <stop offset="1" stop-color="#f2877a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#04060d" flood-opacity=".35"/>
    </filter>
    <filter id="starGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="eyeClipL">
      <path d="M157 235 Q176 218 195 232 Q181 251 163 249 Q158 244 157 235 Z"/>
    </clipPath>
    <clipPath id="eyeClipR">
      <path d="M243 235 Q224 218 205 232 Q219 251 237 249 Q242 244 243 235 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#soft)">
    <!-- 躯干 -->
    <path d="M50 500 C56 416 96 372 158 352 L200 378 L242 352 C304 372 344 416 350 500 Z" fill="url(#uniform)"/>
    <!-- 肩部结构线 -->
    <path d="M158 352 C136 372 120 410 116 500" fill="none" stroke="#2c372b" stroke-width="3" opacity=".45"/>
    <path d="M242 352 C264 372 280 410 284 500" fill="none" stroke="#2c372b" stroke-width="3" opacity=".45"/>
    <!-- 领口 -->
    <path d="M158 352 L200 380 L182 414 L146 378 Z" fill="url(#uniformDark)"/>
    <path d="M242 352 L200 380 L218 414 L254 378 Z" fill="url(#uniformDark)"/>
    <path d="M182 414 L200 380 L218 414 L200 432 Z" fill="#d8c9a8"/>

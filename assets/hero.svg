    <path d="M245 233 Q224 214 203 230" fill="none" stroke="#2a1a19" stroke-width="5" stroke-linecap="round"/>
    <path d="M238 247 Q222 252 208 242" fill="none" stroke="#d99a86" stroke-width="2" stroke-linecap="round" opacity=".75"/>
    <!-- 鼻子 -->
    <path d="M196 262 Q200 268 204 262" fill="none" stroke="#c98a72" stroke-width="3" stroke-linecap="round"/>
    <path d="M193 266 Q200 271 207 266" fill="none" stroke="#ffffff" stroke-width="1.5" opacity=".25"/>
    <!-- 嘴 -->
    <path d="M185 292 Q200 302 215 292" fill="none" stroke="#9c4f4a" stroke-width="4" stroke-linecap="round"/>
    <path d="M190 293 Q200 298 210 293" fill="none" stroke="#e59a8f" stroke-width="1.5" opacity=".7"/>
    <!-- 下巴 / 轮廓光 -->
    <path d="M180 326 Q200 336 220 326" fill="none" stroke="#c9856c" stroke-width="2" opacity=".35"/>
    <path d="M146 214 Q148 284 174 324" fill="none" stroke="#8fe9ff" stroke-width="3" opacity=".5"/>
    <path d="M254 212 Q252 280 228 322" fill="none" stroke="#ffc08a" stroke-width="3" opacity=".4"/>
    <!-- 衣服轮廓光 -->
    <path d="M60 496 C68 424 104 382 154 360" fill="none" stroke="#8fe9ff" stroke-width="3" opacity=".35"/>
    <path d="M340 496 C332 424 296 382 246 360" fill="none" stroke="#ffc08a" stroke-width="3" opacity=".28"/>
  </g>
</svg>

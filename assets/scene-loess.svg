<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171129"/>
      <stop offset=".28" stop-color="#402744"/>
      <stop offset=".5" stop-color="#8a4a4c"/>
      <stop offset=".68" stop-color="#cf714f"/>
      <stop offset=".83" stop-color="#f2a463"/>
      <stop offset="1" stop-color="#ffd08a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff1c9" stop-opacity=".95"/>
      <stop offset=".22" stop-color="#ffd48a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b4b4b"/>
      <stop offset="1" stop-color="#593238"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8623f"/>
      <stop offset=".55" stop-color="#8a4b32"/>
      <stop offset="1" stop-color="#5f3024"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98b4e"/>
      <stop offset=".4" stop-color="#a96a3b"/>
      <stop offset="1" stop-color="#6c3d24"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78452b"/>
      <stop offset="1" stop-color="#3d2117"/>
    </linearGradient>
    <linearGradient id="cave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b47a4c"/>
      <stop offset="1" stop-color="#7b4a2e"/>
    </linearGradient>
    <radialGradient id="windowGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe7a8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffb75e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dust" width="170" height="170" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="30" r="1.6" fill="#ffd9a0" opacity=".35"/>
      <circle cx="82" cy="92" r="1.2" fill="#ffd9a0" opacity=".25"/>
      <circle cx="134" cy="44" r="1.8" fill="#ffd9a0" opacity=".3"/>
      <circle cx="52" cy="142" r="1.3" fill="#ffd9a0" opacity=".22"/>
    </pattern>
    <clipPath id="clip"><rect width="1600" height="900"/></clipPath>
    <radialGradient id="vig" cx=".5" cy=".46" r=".74">
      <stop offset=".5" stop-color="#0b0610" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0610" stop-opacity=".5"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1600" height="900" fill="url(#sky)"/>

    <!-- 朝阳 -->
    <circle cx="1160" cy="400" r="310" fill="url(#sunGlow)"/>
    <circle cx="1160" cy="400" r="58" fill="#fff2ca" opacity=".95"/>
    <circle cx="1160" cy="400" r="45" fill="#fffbf0"/>

    <!-- 云 -->
    <g filter="url(#soft)" opacity=".55">
      <path d="M-80 300 C140 270 300 302 480 284 C680 264 840 296 1040 278 C1220 262 1420 290 1680 270 L1680 340 C1420 360 1220 332 1040 348 C840 366 680 334 480 352 C300 370 140 338 -80 368 Z" fill="#8a4a54"/>
      <path d="M-80 440 C140 410 320 438 500 424 C700 408 880 436 1080 420 C1280 404 1460 430 1680 414 L1680 462 C1460 478 1280 452 1080 468 C880 484 700 456 500 472 C320 486 140 458 -80 488 Z" fill="#c97757" opacity=".65"/>
    </g>
    <g fill="#ffcf92" opacity=".35" filter="url(#soft2)">
      <path d="M-40 370 C180 346 360 366 540 352 C740 336 920 358 1120 344 C1320 330 1500 350 1660 340 L1660 350 C1500 360 1320 340 1120 354 C920 368 740 346 540 362 C360 376 180 356 -40 380 Z"/>
      <path d="M180 486 C360 470 520 484 700 474 C880 464 1060 480 1240 470 C1380 462 1500 472 1620 466 L1620 476 C1500 482 1380 472 1240 480 C1060 490 880 474 700 484 C520 494 360 480 180 496 Z"/>
    </g>

    <!-- 飞鸟 -->
    <g fill="none" stroke="#3a2130" stroke-width="2.4" stroke-linecap="round" opacity=".6">
      <path d="M280 300 q10 -8 20 0 q10 -8 20 0"/>
      <path d="M340 260 q8 -6 16 0 q8 -6 16 0"/>
      <path d="M214 250 q7 -5 14 0 q7 -5 14 0"/>
      <path d="M1280 250 q9 -7 18 0 q9 -7 18 0"/>
      <path d="M1340 292 q7 -5 14 0 q7 -5 14 0"/>
    </g>

    <!-- 远山 -->
    <path d="M-40 560 C120 500 240 522 360 540 C500 562 600 514 740 536 C880 558 980 512 1120 534 C1260 556 1380 508 1520 532 C1580 542 1620 550 1660 546 L1660 900 L-40 900 Z" fill="url(#hillFar)" opacity=".85"/>
    <path d="M-40 620 C140 570 300 596 460 606 C620 616 760 582 920 600 C1080 618 1220 586 1360 602 C1480 616 1580 604 1660 610 L1660 900 L-40 900 Z" fill="url(#hillMid)" opacity=".9"/>

    <!-- 梯田远层 -->
    <g fill="none" stroke="#d39a62" stroke-linecap="round" opacity=".28">
      <path d="M-40 650 C150 616 320 640 480 644 C660 648 820 622 1000 636 C1180 650 1360 626 1660 640" stroke-width="4"/>
      <path d="M-40 682 C160 650 340 672 520 674 C700 676 880 652 1060 664 C1240 676 1420 656 1660 666" stroke-width="3"/>
      <path d="M-40 714 C180 684 360 704 540 704 C740 704 920 682 1100 692 C1280 702 1460 686 1660 694" stroke-width="2.5"/>
    </g>

    <!-- 中景黄土坡 -->
    <path d="M-40 720 C120 650 280 660 430 690 C560 716 700 676 860 690 C1020 704 1150 670 1300 688 C1430 704 1540 690 1660 700 L1660 900 L-40 900 Z" fill="url(#hillNear)"/>

    <!-- 坡面沟壑 -->
    <g fill="none" stroke="#7a472a" stroke-linecap="round" opacity=".5">
      <path d="M180 720 C200 760 210 810 200 880" stroke-width="5"/>
      <path d="M520 700 C540 744 542 800 532 870" stroke-width="4"/>
      <path d="M760 706 C780 750 782 802 774 866" stroke-width="5"/>
      <path d="M1180 704 C1200 748 1202 800 1194 864" stroke-width="4"/>
      <path d="M1400 710 C1420 754 1422 806 1414 870" stroke-width="5"/>
    </g>

    <!-- 窑洞群 -->
    <g transform="translate(1000 560)">
      <path d="M-20 140 L-20 10 L330 10 L330 140 Z" fill="url(#cave)"/>
      <path d="M-30 14 L0 -12 L350 -12 L350 14 Z" fill="#8a5434"/>
      <path d="M-30 12 L350 12 L350 26 L-30 26 Z" fill="#5f3826" opacity=".55"/>
      <!-- 窑洞门脸 -->
      <g>
        <path d="M10 140 L10 70 Q10 34 48 34 Q86 34 86 70 L86 140 Z" fill="#3c231a"/>
        <path d="M18 140 L18 74 Q18 46 48 46 Q78 46 78 74 L78 140 Z" fill="#24140f"/>
        <path d="M22 140 L22 76 Q22 52 48 52 Q74 52 74 76 L74 140 Z" fill="#d99052" opacity=".35"/>
        <path d="M32 140 L32 80 Q32 64 48 64 Q64 64 64 80 L64 140 Z" fill="#1a0e0a"/>
        <path d="M34 138 L34 82 Q34 68 48 68 Q62 68 62 82 L62 138 Z" fill="#ffcf7a" opacity=".85"/>
        <!-- 窗格 -->
        <path d="M48 68 L48 138 M34 96 L62 96 M34 116 L62 116" stroke="#3c231a" stroke-width="2.5" opacity=".7"/>
        <circle cx="48" cy="88" r="26" fill="url(#windowGlow)" opacity=".55"/>
      </g>
      <g>
        <path d="M124 140 L124 82 Q124 50 156 50 Q188 50 188 82 L188 140 Z" fill="#3c231a"/>
        <path d="M132 140 L132 84 Q132 58 156 58 Q180 58 180 84 L180 140 Z" fill="#24140f"/>
        <path d="M144 140 L144 88 Q144 74 156 74 Q168 74 168 88 L168 140 Z" fill="#ffcf7a" opacity=".8"/>
        <path d="M156 74 L156 140 M144 104 L168 104" stroke="#3c231a" stroke-width="2.2" opacity=".7"/>
      </g>
      <g>
        <path d="M222 140 L222 74 Q222 40 260 40 Q298 40 298 74 L298 140 Z" fill="#3c231a"/>
        <path d="M230 140 L230 78 Q230 50 260 50 Q290 50 290 78 L290 140 Z" fill="#24140f"/>
        <path d="M242 140 L242 82 Q242 66 260 66 Q278 66 278 82 L278 140 Z" fill="#ffcf7a" opacity=".9"/>
        <path d="M260 66 L260 140 M242 96 L278 96 M242 118 L278 118" stroke="#3c231a" stroke-width="2.4" opacity=".7"/>
        <circle cx="260" cy="92" r="30" fill="url(#windowGlow)" opacity=".5"/>
      </g>
      <!-- 院墙 -->
      <path d="M-20 140 L330 140 L330 154 L-20 154 Z" fill="#6b402a"/>
      <path d="M-20 154 L330 154 L330 162 L-20 162 Z" fill="#3f2419" opacity=".6"/>
    </g>

    <!-- 山坡上的红旗与队伍 -->
    <g transform="translate(690 560)">
      <path d="M0 0 L2 -124" stroke="#4a3020" stroke-width="5"/>
      <path d="M2 -120 C40 -136 70 -112 106 -124 C94 -102 110 -84 100 -62 C64 -50 38 -72 2 -60 Z" fill="#d42f3f" filter="url(#glow)"/>
      <path d="M2 -120 C40 -136 70 -112 106 -124" fill="none" stroke="#ff9a9a" stroke-width="2" opacity=".55"/>
      <polygon points="40,-104 44,-96 52,-96 46,-90 48,-82 40,-87 32,-82 34,-90 28,-96 36,-96" fill="#ffd166" opacity=".95"/>
      <!-- 到达的队伍 -->
      <g fill="#24130f" opacity=".95">
        <g transform="translate(-160 30) scale(.62)">
          <circle cx="0" cy="-44" r="8"/>
          <path d="M-8 -34 Q0 -41 8 -34 L11 2 L5 2 L2 -16 L0 2 L-5 2 L-8 -16 L-12 2 L-17 2 Z"/>
          <path d="M-7 -29 L-18 -7 M7 -29 L18 -9" stroke="#24130f" stroke-width="5" stroke-linecap="round"/>
          <path d="M-4 2 L-8 30 M4 2 L9 30" stroke="#24130f" stroke-width="5" stroke-linecap="round"/>
        </g>
        <g transform="translate(-112 38) scale(.58)">
          <circle cx="0" cy="-44" r="8"/>
          <path d="M-8 -34 Q0 -41 8 -34 L11 2 L5 2 L2 -16 L0 2 L-5 2 L-8 -16 L-12 2 L-17 2 Z"/>
          <path d="M-7 -29 L-18 -7 M7 -29 L18 -9" stroke="#24130f" stroke-width="5" stroke-linecap="round"/>
          <path d="M-4 2 L-8 30 M4 2 L9 30" stroke="#24130f" stroke-width="5" stroke-linecap="round"/>
        </g>
        <g transform="translate(-66 44) scale(.6)">
          <circle cx="0" cy="-44" r="8"/>
          <path d="M-8 -34 Q0 -41 8 -34 L11 2 L5 2 L2 -16 L0 2 L-5 2 L-8 -16 L-12 2 L-17 2 Z"/>
          <path d="M-7 -29 L-18 -7 M7 -29 L18 -9" stroke="#24130f" stroke-width="5" stroke-linecap="round"/>
          <path d="M-4 2 L-8 30 M4 2 L9 30" stroke="#24130f" stroke-width="5" stroke-linecap="round"/>
        </g>
        <g transform="translate(-22 48) scale(.56)">
          <circle cx="0" cy="-44" r="8"/>
          <path d="M-8 -34 Q0 -41 8 -34 L11 2 L5 2 L2 -16 L0 2 L-5 2 L-8 -16 L-12 2 L-17 2 Z"/>
          <path d="M-7 -29 L-18 -7 M7 -29 L18 -9" stroke="#24130f" stroke-width="5" stroke-linecap="round"/>
          <path d="M-4 2 L-8 30 M4 2 L9 30" stroke="#24130f" stroke-width="5" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- 前景黄土坡 -->
    <path d="M-40 790 C160 740 340 760 520 776 C700 792 880 756 1060 772 C1240 788 1420 758 1660 778 L1660 900 L-40 900 Z" fill="url(#ground)"/>
    <path d="M-40 830 C180 796 380 816 580 824 C780 832 980 806 1180 818 C1360 828 1520 814 1660 822 L1660 900 L-40 900 Z" fill="#2c1811" opacity=".55"/>

    <!-- 枯草 -->
    <g stroke="#2a1710" stroke-linecap="round" opacity=".9">
      <path d="M60 900 Q70 850 62 812 M78 900 Q86 858 84 826 M96 900 Q104 866 102 838" stroke-width="3"/>
      <path d="M150 900 Q160 862 154 834 M168 900 Q174 870 172 846" stroke-width="2.5"/>
      <path d="M1470 900 Q1480 854 1472 818 M1490 900 Q1498 862 1496 832 M1510 900 Q1516 872 1514 850" stroke-width="3"/>
      <path d="M1560 900 Q1570 866 1564 840" stroke-width="2.5"/>
    </g>

    <!-- 暖色尘土光 -->
    <rect width="1600" height="900" fill="url(#dust)"/>
    <g filter="url(#soft)" opacity=".22">
      <ellipse cx="1180" cy="520" rx="420" ry="80" fill="#ffd08a"/>
      <ellipse cx="480" cy="680" rx="360" ry="50" fill="#ffb36b"/>
    </g>

    <!-- 柔和暗角 -->
    <rect width="1600" height="900" fill="url(#vig)"/>
  </g>
</svg>
